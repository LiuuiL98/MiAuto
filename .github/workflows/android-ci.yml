name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only; this workflow needs no write scopes and touches no secret beyond the optional
# SDK dex below, so it runs unchanged on pull requests opened from forks. Fork PRs get no
# secrets, which is why the SDK-restore step is allowed to be a no-op.
permissions:
  contents: read

jobs:
  build:
    name: Build (github debug + release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # NDK/CMake versions are pinned in app/build.gradle.kts; install the exact versions
      # rather than relying on whatever the runner ships. Retried because sdkmanager
      # downloads occasionally arrive corrupt ("Error on ZipFile unknown archive") on
      # GitHub-hosted runners.
      - name: Install pinned NDK and CMake
        run: |
          for attempt in 1 2 3; do
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Check core translations
        run: python3 scripts/check_localization.py

      # The CarWith / CarLink protocol SDK is a proprietary prebuilt dex and is therefore
      # not in git (see app/libs/README.md). Without it the build still succeeds, but the
      # packaged APK has no CarWith support: injectIccoaDex is skipped and only the
      # compile-time stub jar is used.
      - name: Restore ICCOA SDK dex (optional)
        env:
          ICCOA_SDK_DEX_BASE64: ${{ secrets.ICCOA_SDK_DEX_BASE64 }}
        run: |
          if [ -n "${ICCOA_SDK_DEX_BASE64:-}" ]; then
            printf '%s' "$ICCOA_SDK_DEX_BASE64" | base64 -d > app/libs/icar-sdk.dex
            echo "SDK dex restored: $(stat -c%s app/libs/icar-sdk.dex) bytes"
          else
            echo "::warning title=CarWith support missing::ICCOA_SDK_DEX_BASE64 is not set for this run, so the artifact will not be able to connect to CarWith."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # github flavor only: the playstore flavor is not covered by this repository's CI.
      # The release variant is compiled here as an R8 / resource-shrinking check; it is
      # left unsigned because key.properties is not in the repository.
      - name: Assemble github debug and release
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubRelease --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miauto-github-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miauto-github-release-apk
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: warn

  unit-test:
    name: Unit tests (github debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # See the build job for why NDK/CMake are pinned and the install is retried.
      - name: Install pinned NDK and CMake
        run: |
          for attempt in 1 2 3; do
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testGithubDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testGithubDebugUnitTest
            app/build/test-results/testGithubDebugUnitTest
          if-no-files-found: warn
