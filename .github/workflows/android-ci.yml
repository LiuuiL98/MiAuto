name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (github debug + release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # NDK/CMake versions are pinned in app/build.gradle.kts; install the exact versions
      # rather than relying on whatever the runner ships. Retried because sdkmanager
      # downloads occasionally arrive corrupt ("Error on ZipFile unknown archive") on
      # GitHub-hosted runners.
      - name: Install pinned NDK and CMake
        run: |
          for attempt in 1 2 3; do
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      # The source repository intentionally does not commit the prebuilt ICCOA SDK dex.
      # Restore it from the upstream project's public, version-pinned APK release at build
      # time only. This keeps the binary out of this fork's git history while allowing the
      # debug artifact to retain CarWith/ICCOA functionality.
      - name: Restore ICCOA SDK dex from public MiAuto release
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$RUNNER_TEMP/MiAuto-0.1.1.apk"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/PiggyBackBayonet/MiAuto/releases/download/v0.1.1/MiAuto-0.1.1.apk" \
            --output "$source_apk"
          echo "3a348c59cffe3d97f1f7f2d51483d97c4981d83b391a15696c454c6febbc1b45  $source_apk" | sha256sum --check

          python3 - "$source_apk" app/libs/icar-sdk.dex <<'PY'
          import re
          import sys
          import zipfile
          from pathlib import Path

          source_apk = Path(sys.argv[1])
          output_dex = Path(sys.argv[2])
          candidates = []

          with zipfile.ZipFile(source_apk) as zf:
              for name in zf.namelist():
                  if not re.fullmatch(r"classes(?:[0-9]+)?\.dex", name):
                      continue
                  data = zf.read(name)
                  if not data.startswith(b"dex\n"):
                      continue
                  # The ICCOA SDK's generated UCarProto classes have hundreds of
                  # references in the SDK dex; app dexes only refer to a few SDK types.
                  score = data.count(b"com/ucar/databus/proto/UCarProto$")
                  if score >= 100 and len(data) >= 4_000_000:
                      candidates.append((score, len(data), name, data))

          if not candidates:
              raise SystemExit("Could not identify the ICCOA SDK dex in the pinned upstream APK.")
          candidates.sort(reverse=True, key=lambda item: (item[0], item[1]))
          best = candidates[0]
          if len(candidates) > 1 and candidates[1][0] == best[0]:
              raise SystemExit("More than one ICCOA SDK dex matched; refusing an ambiguous injection.")

          output_dex.parent.mkdir(parents=True, exist_ok=True)
          output_dex.write_bytes(best[3])
          print(f"Extracted {best[2]} as {output_dex}: {best[1]} bytes, marker score={best[0]}")
          PY

      - name: Check core translations
        run: python3 scripts/check_localization.py

      - name: Verify ICCOA SDK dex is ready
        run: |
          test -s app/libs/icar-sdk.dex
          echo "ICCOA SDK dex restored: $(stat -c%s app/libs/icar-sdk.dex) bytes"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # github flavor only: the playstore flavor is not covered by this repository's CI.
      - name: Assemble github debug and release
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubRelease --stacktrace

      - name: Verify debug APK contains injected ICCOA SDK
        run: |
          python3 - <<'PY'
          import glob
          import zipfile
          from pathlib import Path

          sd = Path("app/libs/icar-sdk.dex").read_bytes()
          apks = glob.glob("app/build/outputs/apk/github/debug/*.apk")
          if not apks:
              raise SystemExit("No github debug APK was produced")
          matched = False
          for apk in apks:
              with zipfile.ZipFile(apk) as zf:
                  dex_names = [n for n in zf.namelist() if n.startswith("classes") and n.endswith(".dex")]
                  matched = any(zf.read(n) == sd for n in dex_names)
              if matched:
                  print(f"Verified ICCOA SDK dex is present in {apk}")
                  break
          if not matched:
              raise SystemExit("Debug APK does not contain the exact ICCOA SDK dex")
          PY

      - name: Upload functional debug APK for testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: miauto-iccoa-fixed-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK (unsigned, R8 check)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miauto-github-release-apk-unsigned
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: warn

  unit-test:
    name: Unit tests (github debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # See the build job for why NDK/CMake are pinned and the install is retried.
      - name: Install pinned NDK and CMake
        run: |
          for attempt in 1 2 3; do
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testGithubDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testGithubDebugUnitTest
            app/build/test-results/testGithubDebugUnitTest
          if-no-files-found: warn
